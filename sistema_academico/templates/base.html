<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block t %}Portal académico{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><strong>Portal Académico</strong>
{% if session.uid %}<span>{{ session.nombre }}
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="link">Salir</button></form></span>{% endif %}</header>
<main>
{% for m in get_flashed_messages() %}<p class="aviso" role="alert">{{ m }}</p>{% endfor %}
{% block c %}{% endblock %}</main></body></html>
